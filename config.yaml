baseURL: https://cewood.xyz/
locale: "en-uk"
defaultContentLanguage: "en-uk"
title: The ramblings of cewood
theme: hugo-xmin

author:
  name: "Cameron Wood"
  homepage: "https://cewood.xyz"

markup:
  goldmark:
    renderer:
      unsafe: true

menu:
  main:
    - name: "Home"
      url: "/"
      weight: 1
    - name: "About"
      url: "/about"
      weight: 2
    - name: "Places"
      url: "/places"
      weight: 3
    - name: "Subscribe"
      url: "/index.xml"
      weight: 4

