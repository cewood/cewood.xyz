params:
  description: "Just another website built with Hugo."
  footer: "&copy; cewood | [Mastodon](https://mastodon.social/@cewood) | [Twitter](https://twitter.com/cewood) | [Bluesky](https://bsky.app/profile/cewood.bsky.social) | [GitHub](https://github.com/cewood) | [LinkedIn](https://www.linkedin.com/in/cameronewood)"
  highlight:
    style: zenburn

#pygmentsstyle: "zenburn"
pygmentscodefences: true
pygmentscodefencesguesssyntax: true

googleAnalytics: "UPDATEME"
